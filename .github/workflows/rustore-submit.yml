name: Проверенная отправка Android-релиза в RuStore

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Успешный run workflow rustore-build.yml с утверждённым AAB
        required: true
        type: string
      expected_sha256:
        description: SHA-256 именно того AAB, который прошёл финальную проверку
        required: true
        type: string
      qa_attestation:
        description: Введите I_VERIFIED_LOCAL_QA_AND_AAB_SHA256 только после полной локальной QA
        required: true
        type: string
      release_tag:
        description: Android-тег из проверенного CI run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rustore-submit-${{ inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  submit:
    name: Проверка AAB и ручная отправка
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rustore-production

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Установка Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Проверка параметров запуска
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          QA_ATTESTATION: ${{ inputs.qa_attestation }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "CI run ID должен быть положительным целым числом" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Ожидаемый SHA-256 должен содержать ровно 64 шестнадцатеричных символа" >&2
            exit 1
          fi
          if [[ "$QA_ATTESTATION" != "I_VERIFIED_LOCAL_QA_AND_AAB_SHA256" ]]; then
            echo "Подтвердите локальную QA и проверку SHA-256 точного CI AAB" >&2
            exit 1
          fi
          python -c 'from scripts.rustore_release import parse_release_tag; import os; parse_release_tag(os.environ["RELEASE_TAG"])'

      - name: Получение метаданных указанного CI run
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" \
            --output "$RUNNER_TEMP/build-run.json"

      - name: Проверка успешного workflow сборки и тега
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/rustore_release.py verify-run
          --run-metadata "$RUNNER_TEMP/build-run.json"
          --run-id "$BUILD_RUN_ID"
          --release-tag "$RELEASE_TAG"
          --repository "$BUILD_REPOSITORY"

      - name: Загрузка AAB из проверенного CI run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rustore-aab-${{ inputs.build_run_id }}
          path: release-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Проверка SHA-256 и манифеста происхождения AAB
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/rustore_release.py verify-artifact
          --aab release-artifact/app-release.aab
          --provenance release-artifact/provenance.json
          --run-metadata "$RUNNER_TEMP/build-run.json"
          --run-id "$BUILD_RUN_ID"
          --expected-sha256 "$EXPECTED_SHA256"
          --release-tag "$RELEASE_TAG"
          --repository "$BUILD_REPOSITORY"

      - name: Проверка клиента RuStore
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Создание черновика и отправка проверенного AAB
        id: rustore
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          RUSTORE_PACKAGE_NAME: ${{ vars.RUSTORE_PACKAGE_NAME }}
          RUSTORE_WHATS_NEW: ${{ vars.RUSTORE_WHATS_NEW || 'Повысили стабильность и исправили ошибки.' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rustore_release.py submit \
            --tag "$RELEASE_TAG" --aab release-artifact/app-release.aab \
            --whats-new "$RUSTORE_WHATS_NEW" --min-android-version 5 \
            --priority-update 0 --expected-sha256 "$EXPECTED_SHA256"

      - name: Итог отправки на модерацию
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_ID: ${{ steps.rustore.outputs.version_id }}
        run: |
          {
            echo "## Проверенный AAB отправлен на модерацию RuStore"
            echo ""
            echo "- Тег: $RELEASE_TAG"
            echo "- CI run ID: $BUILD_RUN_ID"
            echo "- SHA-256: $EXPECTED_SHA256"
            echo "- RuStore versionId: $VERSION_ID"
          } >> "$GITHUB_STEP_SUMMARY"
