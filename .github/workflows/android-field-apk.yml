name: Проверка полевой сборки Android

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Анализ, тесты и APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Установка Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Установка Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Установка зависимостей
        run: flutter pub get

      - name: Статический анализ
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Тесты приложения
        run: flutter test

      - name: Сборка тестового APK
        run: flutter build apk --debug --no-pub

      - name: Сохранение APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: field-apk-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
