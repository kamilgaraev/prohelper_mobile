name: Допуск PR
on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ['Проверки PR']
    types: [in_progress, completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Номер открытого PR в main
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write

jobs:
  admission:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.id == 199175422)
      || (github.event_name == 'workflow_run' && contains(fromJSON('["pull_request","pull_request_review","pull_request_review_comment"]'), github.event.workflow_run.event))
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: "admission-${{ github.event.workflow_run.display_title || format('PR #{0}', github.event.issue.number || inputs.pr) }}"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Проверка точного head
        env:
          PR_NUMBER: "${{ github.event.workflow_run.display_title || format('PR #{0}', github.event.issue.number || inputs.pr) }}"
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify-release-review.py --status "$PR_NUMBER"
